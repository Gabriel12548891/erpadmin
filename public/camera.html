<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Fotos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1,
        #instructions {
            margin: 20px 0;
            z-index: 3;
            position: relative;
        }

        /* Estilo del video en modo normal */
        video {
            width: 100%;
            max-width: 500px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        /* Estilo cuando la cámara está activa: video a pantalla completa */
        .full-screen-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            border: none;
            border-radius: 0;
        }

        /* Contenedor de controles en modo normal */
        #controls {
            margin-top: 10px;
        }

        /* Controles en modo de cámara activa */
        .fixed-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #gallery {
            margin-top: 30px;
        }

        #gallery h2 {
            margin-bottom: 15px;
        }

        .capture-container {
            display: inline-block;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 5px;
            background: #fff;
        }

        .thumbnail {
            display: block;
            max-width: 100px;
            height: auto;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        .download-link {
            font-size: 12px;
            color: #007BFF;
            text-decoration: none;
        }

        /* Estilos responsive para móviles */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.5rem;
            }

            video {
                max-width: 100%;
                border-width: 1px;
            }

            #controls {
                display: flex;
                flex-direction: column;
                align-items: stretch;
            }

            button {
                padding: 12px 20px;
                font-size: 18px;
                width: 100%;
                margin: 5px 0;
            }

            #gallery h2 {
                font-size: 1.2rem;
            }

            .capture-container {
                width: 45%;
            }
        }

        @media (min-width: 601px) {
            /* ...existing CSS para pantallas grandes... */
        }
    </style>
</head>

<body>
    <h1>Captura de Fotos</h1>
    <p id="instructions" style="font-size: 0.9rem; color: #555;">
        Presiona "Iniciar Cámara" para empezar, luego "Capturar Foto" y finaliza con "Cerrar Cámara" al terminar.
    </p>
    <video id="video" autoplay playsinline></video>
    <div id="controls">
        <button id="startCamera">Iniciar Cámara</button>
        <button id="stopCamera" disabled>Cerrar Cámara</button>
        <button id="capture" disabled>Capturar Foto</button>
        <!-- Se añade botón para alternar flash -->
        <button id="toggleFlash" disabled>Activar Flash</button>
    </div>

    <!-- Canvas oculto para procesar la imagen -->
    <canvas id="canvas" style="display: none;"></canvas>

    <div id="gallery">
        <h2>Galería de Capturas</h2>
    </div>

    <script>
        const video = document.getElementById('video');
        const startCameraBtn = document.getElementById('startCamera');
        const stopCameraBtn = document.getElementById('stopCamera');
        const captureBtn = document.getElementById('capture');
        const toggleFlashBtn = document.getElementById('toggleFlash');
        const controls = document.getElementById('controls');
        const instructions = document.getElementById('instructions');
        const canvas = document.getElementById('canvas');
        const gallery = document.getElementById('gallery');
        let stream, imageCapture, flashOn = false;

        // Función para iniciar la cámara con máxima resolución disponible
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 4096 },
                        height: { ideal: 2160 }
                    }
                });
                video.srcObject = stream;
                video.classList.add('full-screen-video');
                controls.classList.add('fixed-controls');
                instructions.style.display = 'none';
                captureBtn.disabled = false;
                stopCameraBtn.disabled = false;
                startCameraBtn.disabled = true;

                // Verificar si se puede usar el flash mediante ImageCapture API
                const [track] = stream.getVideoTracks();
                if (track) {
                    const capabilities = track.getCapabilities();
                    if (capabilities.torch) {
                        imageCapture = new ImageCapture(track);
                        toggleFlashBtn.disabled = false;
                        toggleFlashBtn.textContent = 'Activar Flash';
                    } else {
                        toggleFlashBtn.disabled = true;
                    }
                }
            } catch (error) {
                console.error("Error al acceder a la cámara: ", error);
                alert("No se pudo acceder a la cámara.");
            }
        }

        // Función para detener la cámara
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                stream = null;
                video.classList.remove('full-screen-video');
                controls.classList.remove('fixed-controls');
                instructions.style.display = 'block';
                captureBtn.disabled = true;
                stopCameraBtn.disabled = true;
                startCameraBtn.disabled = false;
                toggleFlashBtn.disabled = true;
                flashOn = false;
                toggleFlashBtn.textContent = 'Activar Flash';
            }
        }

        startCameraBtn.addEventListener('click', startCamera);
        stopCameraBtn.addEventListener('click', stopCamera);

        // Función para alternar flash usando ImageCapture si está disponible
        toggleFlashBtn.addEventListener('click', async function () {
            if (!imageCapture) return;
            try {
                const [track] = stream.getVideoTracks();
                // Alternar la propiedad torch
                flashOn = !flashOn;
                await track.applyConstraints({
                    advanced: [{ torch: flashOn }]
                });
                toggleFlashBtn.textContent = flashOn ? 'Desactivar Flash' : 'Activar Flash';
            } catch (error) {
                console.error("Error al cambiar el estado del flash:", error);
            }
        });

        // Captura la imagen desde el video, la dibuja en el canvas y genera un Blob
        captureBtn.addEventListener('click', function () {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function (blob) {
                const imgURL = URL.createObjectURL(blob);
                const container = document.createElement('div');
                container.classList.add('capture-container');
                const img = document.createElement('img');
                img.src = imgURL;
                img.classList.add('thumbnail');
                container.appendChild(img);
                const downloadLink = document.createElement('a');
                downloadLink.href = imgURL;
                downloadLink.download = 'captura.png';
                downloadLink.textContent = 'Descargar';
                downloadLink.classList.add('download-link');
                container.appendChild(downloadLink);
                gallery.appendChild(container);
            }, 'image/png');
        });
    </script>
</body>

</html>
